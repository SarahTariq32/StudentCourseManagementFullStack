<div class="auth-card">
  <h2>Welcome Back</h2>
  <p class="subtitle">Please enter your details to sign in.</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="Enter your username"
        [class.is-invalid]="f['username'].touched && f['username'].invalid"
      />
      <small class="error-msg" *ngIf="f['username'].touched && f['username'].errors?.['required']">
        Username is required.
      </small>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
        [class.is-invalid]="f['password'].touched && f['password'].invalid"
      />
      <small class="error-msg" *ngIf="f['password'].touched && f['password'].errors?.['required']">
        Password is required.
      </small>
      <small class="error-msg" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
        Password must be at least 6 characters.
      </small>
    </div>

    <div class="server-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" class="submit-btn" [disabled]="isLoading">
      {{ isLoading ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>

  <div class="auth-footer">
    <p>Don't have an account? <a routerLink="/register">Sign up here</a></p>
  </div>
</div>
