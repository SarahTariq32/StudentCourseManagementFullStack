<div class="min-h-screen flex items-center justify-center bg-brand-50/60 p-4 font-sans">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-brand-100 my-6">
    
    <!-- Branding Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-500 text-white font-bold text-xl mb-3 shadow-md shadow-brand-500/30">
        SC
      </div>
      <h2 class="text-2xl font-bold text-dark-900 tracking-tight">Welcome Back</h2>
      <p class="text-xs text-slate-500 mt-1">Sign in to your Student Management account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      
      <!-- Username -->
      <div class="flex flex-col gap-1.5">
        <label for="username" class="text-xs font-semibold text-dark-800 flex items-center gap-1.5">
          <lucide-icon [img]="UserIcon" class="w-3.5 h-3.5 text-slate-500"></lucide-icon>
          <span>Username</span>
        </label>
        <input 
          id="username" 
          pInputText 
          type="text" 
          formControlName="username" 
          placeholder="Enter your username" 
          class="w-full p-inputtext-sm focus:border-brand-500"
          [class.ng-invalid]="f['username'].touched && f['username'].invalid"
        />
        <small *ngIf="f['username'].touched && f['username'].invalid" class="text-xs text-accent-rose font-medium">
          Username is required.
        </small>
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-xs font-semibold text-dark-800 flex items-center gap-1.5">
          <lucide-icon [img]="LockIcon" class="w-3.5 h-3.5 text-slate-500"></lucide-icon>
          <span>Password</span>
        </label>
        <p-password
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full p-inputtext-sm focus:border-brand-500"
          [class.ng-invalid]="f['password'].touched && f['password'].invalid"
        ></p-password>
        <small *ngIf="f['password'].touched && f['password'].invalid" class="text-xs text-accent-rose font-medium">
          <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
          <span *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters.</span>
        </small>
      </div>

      <!-- Server Error Banner -->
      <div *ngIf="errorMessage" class="bg-rose-50 text-accent-rose border border-rose-200 p-3 rounded-lg text-xs font-medium flex items-center gap-2 my-1">
        <lucide-icon [img]="AlertIcon" class="w-4 h-4 flex-shrink-0"></lucide-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Submit Button -->
      <button 
        pButton 
        type="submit" 
        [disabled]="isLoading"
        class="w-full mt-2 bg-brand-500 hover:bg-brand-600 text-white font-medium py-2.5 rounded-lg border-none transition shadow-lg shadow-brand-500/20 flex items-center justify-center gap-2 cursor-pointer"
      >
        <lucide-icon *ngIf="!isLoading" [img]="LogInIcon" class="w-4 h-4"></lucide-icon>
        <i *ngIf="isLoading" class="pi pi-spin pi-spinner text-sm"></i>
        <span>{{ isLoading ? 'Signing In...' : 'Sign In' }}</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
      <p>Don't have an account? <a routerLink="/register" class="text-brand-600 hover:text-brand-700 font-semibold underline transition">Register here</a></p>
    </div>
  </div>
</div>
