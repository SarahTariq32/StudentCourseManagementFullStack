<div class="auth-card">
  <h2>Create Account</h2>
  <p class="subtitle">Join the Student Management Portal.</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" formControlName="fullName" placeholder="Jane Doe" />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="jane@example.com" />
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" placeholder="janedoe" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label for="role">Register As</label>
      <select id="role" formControlName="role">
        <option value="Student">Student</option>
        <option value="Admin">Admin</option>
      </select>
    </div>

    <div *ngIf="errorMessage" class="server-error">
      {{ errorMessage }}
    </div>

    <button type="submit" class="submit-btn" [disabled]="isLoading || registerForm.invalid">
      {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
    </button>
  </form>

  <div class="auth-footer">
    <p>Already have an account? <a routerLink="/login">Sign in here</a></p>
  </div>
</div>
