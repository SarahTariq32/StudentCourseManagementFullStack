<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4 font-sans">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-200/60">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome Back</h2>
      <p class="text-xs text-slate-500 mt-1">Please enter your details to sign in.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <!-- Username Field -->
      <div class="flex flex-col gap-1.5">
        <label for="username" class="text-xs font-semibold text-slate-700">Username</label>
        <input
          id="username"
          pInputText
          type="text"
          formControlName="username"
          placeholder="Enter your username"
          class="w-full p-inputtext-sm"
          [class.ng-invalid]="f['username'].touched && f['username'].invalid"
          [class.ng-dirty]="f['username'].touched"
        />
        <small class="text-xs text-rose-600 font-medium" *ngIf="f['username'].touched && f['username'].errors?.['required']">
          Username is required.
        </small>
      </div>

      <!-- Password Field -->
      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-xs font-semibold text-slate-700">Password</label>
        <p-password
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full p-inputtext-sm"
          [class.ng-invalid]="f['password'].touched && f['password'].invalid"
          [class.ng-dirty]="f['password'].touched"
        ></p-password>
        <small class="text-xs text-rose-600 font-medium" *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Password is required.
        </small>
        <small class="text-xs text-rose-600 font-medium" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
          Password must be at least 6 characters.
        </small>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="bg-rose-50 text-rose-800 border border-rose-200 p-3 rounded-lg text-xs text-center font-medium my-1">
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button 
        pButton 
        type="submit" 
        [label]="isLoading ? 'Signing in...' : 'Sign In'" 
        [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-sign-in'"
        [disabled]="isLoading"
        class="w-full mt-2 p-button-primary"
      ></button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
      <p>Don't have an account? <a routerLink="/register" class="text-sky-600 hover:text-sky-700 font-semibold underline transition">Sign up here</a></p>
    </div>
  </div>
</div>
